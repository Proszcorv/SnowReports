name: Reggeli időjárás
 
on:
  schedule:
    - cron: "30 00 * * *"
  workflow_dispatch: # kézi indítás az Actions fülön
 
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Értesítés küldése
        env:
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          PLACE: ${{ vars.PLACE }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python weather_alert.py
